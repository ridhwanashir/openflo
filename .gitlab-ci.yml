# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
- secret-detection
- sync-csv

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection

include:
- template: Security/Secret-Detection.gitlab-ci.yml
- project: 'cbo/b2b-data-monetization/data-engineer/ci-template'
  file: '.gcp-wif-auth.yml'

# ---------------------------------------------------------------------------
# Intended future automation: upload rnr_app_category_v2.csv to GCS from GitLab.
# Current operating mode is manual GCS upload because runner WIF access to GCS
# is not confirmed working. Cloud Composer reads only the GCS object.
# ---------------------------------------------------------------------------
# DEBUG: keep manual until WIF / GCS access is fixed.
debug-wif-claims:
  stage: sync-csv
  image: google/cloud-sdk:slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  id_tokens:
    GCP_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/427976717042/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-ioh-provider
  script:
    - echo "=== OIDC claims ===" && echo "$GCP_OIDC_TOKEN" | cut -d'.' -f2 | python3 -c "import sys,base64,json; d=sys.stdin.read().strip(); d+='='*(-len(d)%4); print(json.dumps(json.loads(base64.b64decode(d)),indent=2))"
    - echo "CI_PROJECT_PATH=$CI_PROJECT_PATH"
    - echo "CI_PROJECT_NAMESPACE=$CI_PROJECT_NAMESPACE"

upload-csv-to-gcs:
  stage: sync-csv
  extends: .gcp-wif-auth
  variables:
    GCP_WI_PROVIDER_PATH: "projects/427976717042/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-ioh-provider"
    GCP_SERVICE_ACCOUNT_EMAIL: "gitlab-ci-de@appl-int-df-prd-wd2y.iam.gserviceaccount.com"
    GCP_TARGET_PROJECT_ID: "data-int-advana-prd-77c3"
    # GCP_TARGET_PROJECT_ID: data-int-advana-prd-77c3
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - rnr_app_category_v2.csv
      when: manual
      allow_failure: true
  script:
    - gcloud storage cp rnr_app_category_v2.csv
        gs://create_gcs_table/app-category-mapping/rnr_app_category_v2.csv
