upload-csv-to-gcs:
  stage: sync-csv
  extends: .gcp-wif-auth
  variables:
    GCP_WI_PROVIDER_PATH: "projects/427976717042/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-ioh-provider"
    GCP_SERVICE_ACCOUNT_EMAIL: "gitlab-ci-de@appl-int-df-prd-wd2y.iam.gserviceaccount.com"
    GCP_TARGET_PROJECT_ID: "data-int-advana-prd-77c3"
    # GCP_TARGET_PROJECT_ID: data-int-advana-prd-77c3
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - rnr_app_category_v2.csv
  script:
    - gcloud storage cp rnr_app_category_v2.csv
        gs://create_gcs_table/app-category-mapping/rnr_app_category_v2.csv
